# iOS release: build, sign and upload to TestFlight.
#
# Needs the Apple Developer Program ($99 a year) and four repository secrets
# (Settings → Secrets and variables → Actions), set up as described in
# docs/MOBILE.md §3.3 in the server repository:
#
#   ASC_KEY_ID      App Store Connect API key id
#   ASC_ISSUER_ID   its issuer id
#   ASC_KEY_P8      the whole text of the .p8 file
#   APPLE_TEAM_ID   the 10-character team id (developer.apple.com → Membership)
#
# Signing is automatic: Xcode uses the API key to make the certificate and
# profile it needs, so there is nothing to export from a Mac. Run by hand
# only (Actions → iOS release → Run workflow). Not yet run for real — there
# is no account yet — so the first run is also its test.
name: iOS release

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check the Apple secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See docs/MOBILE.md §3.3 in the server repository."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Expo SDK 57 builds part of itself with Swift 6.2, which is Xcode 26.
      - name: Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios
        env:
          CI: 1

      - name: Put the API key where Xcode can read it
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/CloudeIDE.xcworkspace -scheme CloudeIDE \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/CloudeIDE.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 60

      # destination=upload sends the build straight to App Store Connect,
      # where it appears under TestFlight after Apple's processing (minutes
      # to an hour).
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/CloudeIDE.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
